org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
# this machine has no working IPv6 route: Java must not try it first.
systemProp.java.net.preferIPv4Stack=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# ── player core (Rust) ──
# path to the core repository (rs_dream_player), relative to this project.
# Can be overridden in local.properties (dream.core.dir=...).
dream.core.dir=../rs_dream_player
# ABIs the core .so is built for (debug: a phone + the x86_64 emulator).
dream.abis=arm64-v8a,x86_64
